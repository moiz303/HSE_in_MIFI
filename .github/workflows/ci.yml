name: ci

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline unit tests on synthetic fixtures
        env:
          KAGGLE_CONFIG_DIR: ${{ runner.temp }}/empty-kaggle-config
        run: python -m unittest discover -s tests -t . -v

      - name: Pipeline is importable and self-documenting
        run: python -m src.pipeline --help

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vacv-baseline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "rdkit", "scikit-learn"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
